# Gradle daemon 内存；实际构建缓存与发行版都在 <GRADLE_USER_HOME>（见 AGENTS.md）。
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment 参数名（保留 MDK 默认，取消注释会增加一次下载）
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# 环境版本：必须与 1.21.1 对应
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
# mods.toml 里声明的最低 NeoForge（WindowX 要求 >= 21.1.234）
neo_version_range=[21.1.234,)
loader_version_range=[4,)

## Mod 属性

mod_id=stevetomadeline
mod_name=SteveToMadeline
# 许可证待定，发布前必须确认（见计划书第 7 节版权风险）
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.stevetomadeline
