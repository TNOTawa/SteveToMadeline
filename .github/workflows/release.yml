name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install headless OpenGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libglx-mesa0 libx11-6 libxext6 \
            libxrandr2 libxcursor1 libxinerama1 libxi6 libxxf86vm1

      - name: Build and test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew build --no-daemon --console=plain

      - name: Generate checksums
        run: |
          cd build/libs
          sha256sum stevetomadeline-*.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(cat .github/release-notes.md)"
          gh release create "$GITHUB_REF_NAME" \
            build/libs/stevetomadeline-*.jar \
            build/libs/SHA256SUMS.txt \
            --title "SteveToMadeline $GITHUB_REF_NAME" \
            --notes "$NOTES" \
            --generate-notes \
            --verify-tag
