# SteveToMadeline 元数据。占位符由 Gradle 在 generateModMetadata 阶段展开。
modLoader="javafml"
loaderVersion="${loader_version_range}"

# MIT；第三方代码与本机游戏资源的授权边界见 THIRD_PARTY_NOTICES.md。
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="TNOTawa"
description='''
Minecraft 1.21.1 NeoForge 上的 Celeste 风格二维横版平台跳跃：R 进入/退出横版模式，Tab 顺时针切换运动平面，
服务端权威的 60 Hz 物理，包含冲刺、墙跳、攀爬、游泳与进阶技巧；可从本机 Celeste 安装读取角色图集与音效
（不随模组分发商业资源），支持键盘/鼠标与手柄多键位、F8 设置界面和可选的 WindowX 分层远景。
'''

# 平面运动约束和客户端摄像机/前景处理
[[mixins]]
config="stevetomadeline.mixins.json"

# WindowX is optional and only used by the experimental LAYERED background.
[[dependencies.${mod_id}]]
    modId="windowx"
    type="optional"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
