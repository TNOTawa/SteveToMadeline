# SteveToMadeline 元数据。占位符由 Gradle 在 generateModMetadata 阶段展开。
modLoader="javafml"
loaderVersion="${loader_version_range}"

# 许可证待定：计划书要求发布前确认 Celeste 资源与参考项目的授权边界
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="TNOTawa"
description='''
Minecraft 1.21.1 NeoForge 上的 Celeste 风格二维横版移动：R 进入/退出 Celeste 模式，Tab 旋转运动平面，
默认连续景深与保守地形裁切；安装 WindowX 后可使用实验性的旧分层视差。已接入基础跑跳、
八方向冲刺、墙面动作和体力，支持键盘、鼠标与手柄多键位绑定；玛德琳表现计划在后续阶段实现。
'''

# 平面运动约束和客户端摄像机/前景处理
[[mixins]]
config="stevetomadeline.mixins.json"

# WindowX is optional and only used by the experimental LAYERED background.
[[dependencies.${mod_id}]]
    modId="windowx"
    type="optional"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
